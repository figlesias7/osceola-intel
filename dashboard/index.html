<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Osceola Motivated Seller Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0b0e13;--surface:#111520;--border:#1e2535;--border2:#252d42;
  --text:#c8d0e0;--muted:#5a6480;--accent:#e8441a;--accent2:#f5a623;
  --green:#22c55e;--blue:#3b82f6;
  --mono:'IBM Plex Mono',monospace;--display:'Syne',sans-serif;--r:4px;
  --header-h:64px;--stats-h:72px;--controls-h:48px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;
     display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}

/* scanlines */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px)}

/* ── header ── */
header{
  height:var(--header-h);flex-shrink:0;
  border-bottom:1px solid var(--border2);
  padding:0 24px;display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);z-index:50;
}
.logo{font-family:var(--display);font-size:20px;font-weight:800;color:#fff}
.logo span{color:var(--accent)}
.sub{font-size:10px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.meta{display:flex;gap:16px;align-items:center}
.badge{font-size:10px;padding:3px 9px;border:1px solid var(--border2);border-radius:2px;
       color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.badge.live{border-color:var(--green);color:var(--green)}
#fetch-time{font-size:11px;color:var(--muted)}

/* ── stats ── */
#stats-bar{
  height:var(--stats-h);flex-shrink:0;
  display:grid;grid-template-columns:repeat(6,1fr);
  border-bottom:1px solid var(--border);
}
.stat{padding:12px 20px;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-val{font-family:var(--display);font-size:28px;font-weight:800;color:#fff;line-height:1}
.stat-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}

/* ── controls ── */
#controls{
  height:var(--controls-h);flex-shrink:0;
  display:flex;gap:8px;align-items:center;
  padding:0 16px;border-bottom:1px solid var(--border);
  overflow-x:auto;
}
input[type=search]{
  background:var(--surface);border:1px solid var(--border2);color:var(--text);
  font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:var(--r);
  width:220px;flex-shrink:0;outline:none;transition:border-color .2s;
}
input[type=search]:focus{border-color:var(--accent)}
input[type=search]::placeholder{color:var(--muted)}
.filter-btn{
  background:var(--surface);border:1px solid var(--border2);color:var(--muted);
  font-family:var(--mono);font-size:11px;padding:5px 11px;border-radius:var(--r);
  cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:#1a0d08}
.filter-btn[data-cat="foreclosure"].active{border-color:#ef4444;color:#ef4444;background:#180909}
.filter-btn[data-cat="judgment"].active{border-color:#a855f7;color:#a855f7;background:#130a1a}
.filter-btn[data-cat="lien"].active{border-color:#f59e0b;color:#f59e0b;background:#17100a}
.filter-btn[data-cat="tax"].active{border-color:#06b6d4;color:#06b6d4;background:#070f14}
.filter-btn[data-cat="probate"].active{border-color:#84cc16;color:#84cc16;background:#0b1108}
.sort-sel{
  background:var(--surface);border:1px solid var(--border2);color:var(--text);
  font-family:var(--mono);font-size:11px;padding:5px 8px;border-radius:var(--r);
  cursor:pointer;outline:none;margin-left:auto;flex-shrink:0;
}
.csv-btn{
  background:var(--accent);color:#fff;border:none;
  font-family:var(--mono);font-size:11px;font-weight:700;
  padding:6px 12px;border-radius:var(--r);cursor:pointer;flex-shrink:0;
}
.csv-btn:hover{opacity:.85}

/* ── table wrapper — fills remaining space and scrolls ── */
#table-wrap{
  flex:1;overflow:auto;position:relative;
}

/* ── table ── */
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.c-score {width:52px}
col.c-type  {width:72px}
col.c-date  {width:102px}
col.c-docnum{width:110px}
col.c-owner {width:200px}
col.c-addr  {width:190px}
col.c-amt   {width:90px}
col.c-flags {width:200px}
col.c-link  {width:90px}
col.c-detail{width:64px}

thead{position:sticky;top:0;z-index:10}
thead tr{background:var(--bg);border-bottom:2px solid var(--border2)}
th{
  padding:9px 10px;text-align:left;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:500;white-space:nowrap;
  user-select:none;
}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text)}
th.asc::after{content:" ↑"}
th.desc::after{content:" ↓"}

tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--surface)}
td{padding:9px 10px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.score{display:inline-flex;align-items:center;justify-content:center;
       width:34px;height:20px;border-radius:3px;font-weight:700;font-size:11px}
.score.hi{background:#1c3a1c;color:#4ade80}
.score.mid{background:#3a2a00;color:#fbbf24}
.score.lo{background:#2a1010;color:#f87171}

.type-badge{display:inline-block;padding:2px 6px;border-radius:2px;
            font-size:10px;font-weight:700;letter-spacing:.06em;border:1px solid currentColor}
.cat-foreclosure .type-badge{color:#ef4444}
.cat-judgment    .type-badge{color:#a855f7}
.cat-lien        .type-badge{color:#f59e0b}
.cat-tax         .type-badge{color:#06b6d4}
.cat-probate     .type-badge{color:#84cc16}
.cat-notice      .type-badge{color:#94a3b8}
.cat-other       .type-badge{color:#6b7280}

.flag{display:inline-block;background:#1a1a1a;border:1px solid var(--border2);
      color:var(--muted);font-size:9px;padding:1px 5px;border-radius:2px;
      margin:1px;letter-spacing:.04em}
.flag.hot{border-color:#e8441a55;color:var(--accent)}
.addr{font-size:11px;color:var(--muted)}
.no-addr{font-size:10px;color:#2a3050;font-style:italic}
.amount{color:var(--accent2);font-weight:500}
.doc-link{color:var(--blue);font-size:11px}
.doc-link:hover{text-decoration:underline}

#empty{display:none;text-align:center;padding:80px;color:var(--muted);font-size:12px}

/* ── detail panel ── */
#panel{
  position:fixed;right:0;top:0;bottom:0;width:400px;
  background:var(--surface);border-left:1px solid var(--border2);
  overflow-y:auto;z-index:200;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.16,1,.3,1);
}
#panel.open{transform:translateX(0)}
#panel-close{position:absolute;top:12px;right:12px;background:none;border:none;
             color:var(--muted);font-size:20px;cursor:pointer}
#panel-close:hover{color:#fff}
#panel-body{padding:24px 20px 40px}
.ps{margin-bottom:20px}
.pl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pv{font-size:13px;color:#fff;word-break:break-word}
.pscore{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;margin-bottom:2px}
.pflags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pflag{padding:2px 8px;border:1px solid var(--border2);border-radius:2px;font-size:10px;color:var(--muted)}
.pflag.hot{border-color:#e8441a66;color:var(--accent)}
.copy-btn{background:none;border:1px solid var(--border2);color:var(--muted);
          font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:2px;
          cursor:pointer;margin-left:6px}
.copy-btn:hover{border-color:var(--text);color:var(--text)}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">OSCEOLA <span>LEADS</span></div>
    <div class="sub">Motivated Seller Intelligence · Osceola County, FL</div>
  </div>
  <div class="meta">
    <span class="badge live">● LIVE</span>
    <span id="fetch-time">loading…</span>
    <span id="date-range" class="badge"></span>
  </div>
</header>

<div id="stats-bar">
  <div class="stat"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">Total Leads</div></div>
  <div class="stat"><div class="stat-val" id="s-addr">—</div><div class="stat-lbl">With Address</div></div>
  <div class="stat"><div class="stat-val" id="s-hot">—</div><div class="stat-lbl">Score ≥ 70</div></div>
  <div class="stat"><div class="stat-val" id="s-fc">—</div><div class="stat-lbl">Foreclosure</div></div>
  <div class="stat"><div class="stat-val" id="s-lien">—</div><div class="stat-lbl">Liens</div></div>
  <div class="stat"><div class="stat-val" id="s-avg">—</div><div class="stat-lbl">Avg Score</div></div>
</div>

<div id="controls">
  <input type="search" id="search" placeholder="Search owner, address, doc #…"/>
  <button class="filter-btn active" data-cat="">All</button>
  <button class="filter-btn" data-cat="foreclosure">Foreclosure</button>
  <button class="filter-btn" data-cat="judgment">Judgment</button>
  <button class="filter-btn" data-cat="lien">Lien</button>
  <button class="filter-btn" data-cat="tax">Tax</button>
  <button class="filter-btn" data-cat="probate">Probate</button>
  <button class="filter-btn" data-cat="notice">Notice</button>
  <select class="sort-sel" id="sort-sel">
    <option value="score">Sort: Score ↓</option>
    <option value="filed">Sort: Date ↓</option>
    <option value="amount">Sort: Amount ↓</option>
    <option value="owner">Sort: Owner A→Z</option>
  </select>
  <button class="csv-btn" id="csv-btn">⬇ CSV</button>
</div>

<div id="table-wrap">
  <table id="leads-table">
    <colgroup>
      <col class="c-score"/><col class="c-type"/><col class="c-date"/>
      <col class="c-docnum"/><col class="c-owner"/><col class="c-addr"/>
      <col class="c-amt"/><col class="c-flags"/><col class="c-link"/>
      <col class="c-detail"/>
    </colgroup>
    <thead>
      <tr>
        <th>Score</th>
        <th class="sortable" data-col="doc_type">Type</th>
        <th class="sortable" data-col="filed">Filed</th>
        <th>Doc #</th>
        <th class="sortable" data-col="owner">Owner / Grantor</th>
        <th>Property Address</th>
        <th class="sortable" data-col="amount">Amount</th>
        <th>Flags</th>
        <th>Link</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty">NO RECORDS MATCH YOUR FILTERS</div>
</div>

<div id="panel">
  <button id="panel-close">✕</button>
  <div id="panel-body"></div>
</div>

<script>
let ALL=[], FILTERED=[], sortCol='score', sortDir=-1, catFilter='', q='';

async function boot(){
  try{
    const r = await fetch('records.json?_='+Date.now());
    const d = await r.json();
    ALL = (d.records||[]).filter(r=>r.doc_num && r.doc_type);
    renderStats(d);
    applyFilters();
    document.getElementById('fetch-time').textContent =
      'Updated '+new Date(d.fetched_at).toLocaleString();
    const dr=d.date_range||{};
    document.getElementById('date-range').textContent=(dr.from||'')+' – '+(dr.to||'');
  }catch(e){
    document.getElementById('fetch-time').textContent='No data loaded';
    console.warn(e);
  }
}

function renderStats(d){
  const recs=d.records||[];
  set('s-total',recs.length);
  set('s-addr', d.with_address||0);
  set('s-hot',  recs.filter(r=>r.score>=70).length);
  set('s-fc',   recs.filter(r=>r.cat==='foreclosure').length);
  set('s-lien', recs.filter(r=>r.cat==='lien').length);
  const avg=recs.length?Math.round(recs.reduce((a,r)=>a+r.score,0)/recs.length):0;
  set('s-avg',avg);
}
function set(id,v){document.getElementById(id).textContent=v;}

function applyFilters(){
  const qlo=q.toLowerCase();
  FILTERED=ALL.filter(r=>{
    if(catFilter && r.cat!==catFilter) return false;
    if(qlo && ![r.owner,r.doc_num,r.prop_address,r.mail_address,r.doc_type,r.grantee]
              .join(' ').toLowerCase().includes(qlo)) return false;
    return true;
  });
  FILTERED.sort((a,b)=>{
    const av=a[sortCol]||0, bv=b[sortCol]||0;
    return sortDir*(av<bv?-1:av>bv?1:0);
  });
  renderTable();
}

function renderTable(){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  document.getElementById('empty').style.display=FILTERED.length?'none':'block';
  FILTERED.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.className=`cat-${r.cat||'other'}`;
    tr.style.animationDelay=Math.min(i*15,250)+'ms';
    tr.style.animation='fadeUp .3s both';
    tr.innerHTML=`
      <td>${pill(r.score)}</td>
      <td><span class="type-badge">${esc(r.doc_type)}</span></td>
      <td>${esc(r.filed||'')}</td>
      <td style="font-size:11px">${esc(r.doc_num||'')}</td>
      <td title="${esc(r.owner||'')}">${esc(r.owner||'—')}</td>
      <td>${addrCell(r.prop_address,r.prop_city)}</td>
      <td class="amount">${r.amount?'$'+Number(r.amount).toLocaleString():''}</td>
      <td>${flagsCell(r.flags||[])}</td>
      <td>${r.clerk_url?`<a class="doc-link" href="${esc(r.clerk_url)}" target="_blank" rel="noopener">↗ View</a>`:''}</td>
      <td><button class="filter-btn" style="font-size:10px;padding:3px 7px"
          onclick="openPanel(${i},event)">Detail</button></td>`;
    tr.addEventListener('click',()=>openPanel(i));
    tbody.appendChild(tr);
  });
}

function pill(s){
  const c=s>=70?'hi':s>=45?'mid':'lo';
  return `<span class="score ${c}">${s}</span>`;
}
function addrCell(addr,city){
  if(!addr) return '<span class="no-addr">no address</span>';
  return `<span class="addr">${esc(addr)}${city?', '+esc(city):''}</span>`;
}
function flagsCell(flags){
  return (flags||[]).slice(0,3).map(f=>{
    const h=f.includes('pendens')||f.includes('closure')||f.includes('Probate');
    return `<span class="flag${h?' hot':''}">${esc(f)}</span>`;
  }).join('');
}
function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}

function openPanel(idx,e){
  if(e) e.stopPropagation();
  const r=FILTERED[idx];
  if(!r) return;
  const sc=r.score;
  const col=sc>=70?'#4ade80':sc>=45?'#fbbf24':'#f87171';
  document.getElementById('panel-body').innerHTML=`
    <div class="ps">
      <div class="pl">Seller Score</div>
      <div class="pscore" style="color:${col}">${sc}</div>
      <div style="font-size:11px;color:var(--muted)">${esc(r.cat_label||r.doc_type)}</div>
      <div class="pflags">${(r.flags||[]).map(f=>`<span class="pflag${f.includes('pendens')||f.includes('closure')||f.includes('Probate')?' hot':''}">${esc(f)}</span>`).join('')}</div>
    </div>
    <div class="ps"><div class="pl">Owner / Grantor</div><div class="pv">${esc(r.owner||'—')}</div></div>
    <div class="ps"><div class="pl">Grantee</div><div class="pv">${esc(r.grantee||'—')}</div></div>
    <div class="ps">
      <div class="pl">Property Address</div>
      <div class="pv">${r.prop_address?esc(r.prop_address)+', '+esc(r.prop_city)+', '+esc(r.prop_state)+' '+esc(r.prop_zip):'—'}
      ${r.prop_address?`<button class="copy-btn" onclick="navigator.clipboard.writeText('${r.prop_address}, ${r.prop_city}, ${r.prop_state} ${r.prop_zip}')">copy</button>`:''}
      </div>
    </div>
    <div class="ps">
      <div class="pl">Mailing Address</div>
      <div class="pv">${r.mail_address?esc(r.mail_address)+', '+esc(r.mail_city)+', '+esc(r.mail_state)+' '+esc(r.mail_zip):'—'}
      ${r.mail_address?`<button class="copy-btn" onclick="navigator.clipboard.writeText('${r.mail_address}, ${r.mail_city}, ${r.mail_state} ${r.mail_zip}')">copy</button>`:''}
      </div>
    </div>
    <div class="ps">
      <div class="pl">Document</div>
      <div class="pv" style="font-size:12px;line-height:1.7">
        <div><b>Type:</b> ${esc(r.doc_type)} — ${esc(r.cat_label||'')}</div>
        <div><b>Doc #:</b> ${esc(r.doc_num||'—')}</div>
        <div><b>Filed:</b> ${esc(r.filed||'—')}</div>
        ${r.amount?`<div><b>Amount:</b> $${Number(r.amount).toLocaleString()}</div>`:''}
        ${r.legal?`<div style="color:var(--muted);font-size:11px;margin-top:4px">${esc(r.legal)}</div>`:''}
      </div>
    </div>
    ${r.clerk_url?`<div class="ps"><a href="${esc(r.clerk_url)}" target="_blank" class="csv-btn" style="display:inline-block">↗ View Court Document</a></div>`:''}`;
  document.getElementById('panel').classList.add('open');
}

document.getElementById('panel-close').addEventListener('click',()=>{
  document.getElementById('panel').classList.remove('open');
});
document.getElementById('search').addEventListener('input',e=>{q=e.target.value;applyFilters();});
document.querySelectorAll('.filter-btn[data-cat]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn[data-cat]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    catFilter=btn.dataset.cat;
    applyFilters();
  });
});
document.getElementById('sort-sel').addEventListener('change',e=>{
  sortCol=e.target.value;sortDir=sortCol==='owner'?1:-1;applyFilters();
});
document.querySelectorAll('th.sortable').forEach(th=>{
  th.addEventListener('click',()=>{
    if(sortCol===th.dataset.col) sortDir*=-1;
    else{sortCol=th.dataset.col;sortDir=-1;}
    document.querySelectorAll('th').forEach(t=>t.classList.remove('asc','desc'));
    th.classList.add(sortDir===1?'asc':'desc');
    applyFilters();
  });
});
document.getElementById('csv-btn').addEventListener('click',()=>{
  const cols=['Score','Type','Filed','Doc #','Owner','Grantee','Amount',
              'Prop Address','Prop City','Prop State','Prop Zip',
              'Mail Address','Mail City','Mail State','Mail Zip',
              'Flags','Clerk URL'];
  const rows=[cols,...FILTERED.map(r=>[
    r.score,r.doc_type,r.filed,r.doc_num,r.owner,r.grantee,r.amount,
    r.prop_address,r.prop_city,r.prop_state,r.prop_zip,
    r.mail_address,r.mail_city,r.mail_state,r.mail_zip,
    (r.flags||[]).join('; '),r.clerk_url
  ])];
  const csv=rows.map(r=>r.map(v=>'"'+(v||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`osceola-leads-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
});

boot();
</script>
</body>
</html>
